<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lipunmyynti - TicketGuru</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/lipunmyynti.js" defer></script>
</head>
<body>
  <header>
    <h1>TicketGuru</h1>
    <nav>
      <a href="index.html">Etusivu</a>
      <a href="tapahtumat.html">Tapahtumat</a>
      <a href="lipunmyynti.html">Lipunmyynti</a>
      <a href="raportit.html">Myyntiraportit</a>
    </nav>
  </header>

  <main>
    <h1>Lipunmyynti</h1>

    <section>
      <h2>Kirjautuminen</h2>

      <label for="kayttajatunnus">Käyttäjätunnus:</label>
      <input type="text" id="kayttajatunnus">

      <label for="salasana">Salasana:</label>
      <input type="password" id="salasana">

      <button type="button" id="kirjauduNappi">Kirjaudu</button>
      <button type="button" id="kirjauduUlosNappi">Kirjaudu ulos</button>

      <p id="kirjautumisIlmoitus"></p>
    </section>

    <section>
      <h2>1. Valitse tapahtuma</h2>

      <label for="tapahtumaValinta">Tapahtuma:</label>
      <select id="tapahtumaValinta">
        <option value="">Valitse tapahtuma</option>
      </select>

      <div id="tapahtumaTiedot"></div>
    </section>

    <section>
      <h2>2. Valitse liput</h2>

      <div id="lipputyypit">
        <p>Valitse ensin tapahtuma.</p>
      </div>

      <p id="summa">Yhteensä: 0,00 €</p>

      <button type="button" id="myyLiputNappi">
        Vahvista lipunmyynti
      </button>

      <p id="myyntiIlmoitus"></p>
    </section>

    <section id="myynninTiedot" hidden>
      <h2>3. Myynti onnistui!</h2>
      <div id="myyntiTulos"></div>
    </section>
  </main>
</body>
</html>
