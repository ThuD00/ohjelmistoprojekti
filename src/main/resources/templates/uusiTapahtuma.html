<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lipunmyynti</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
	<h1>Uusi tapahtuma</h1>
		<form action="#" th:object="${tapahtuma}" th:action=null method=null>

			<div class="form-group row">
				<label for="uusiAika" class="col-sm-2 col-form-label col-form-label-lg">Aika</label>
				<div class="col-sm-4">
				<input type="datetime-local" class="form-control form-control-lg" id="uusiAika" th:field="*{aika}">
			</div>
		</div>
			<div class="form-group row">
				<label for="uusiPaikka" class="col-sm-2 col-form-label col-form-label-lg">Paikka</label>
				<div class="col-sm-9">
					<input type="text" class="form-control form-control-lg" id="uusiPaikka" th:field="*{paikka}">
				</div>
			</div>
				<div class="form-group row">
				<label for="uusiKuvaus" class="col-sm-2 col-form-label col-form-label-lg">Kuvaus</label>
				<div class="col-sm-9">
					<input type="text" class="form-control form-control-lg" id="uusiKuvaus" th:field="*{paikka}">
				</div>
			</div>
			<div class="form-group row">
				<label for="uusiKaupunki" class="col-sm-2 col-form-label col-form-label-lg">Kaupunki</label>
				<div class="col-sm-9">
					<input type="text" class="form-control form-control-lg" id="uusiKaupunki" th:field="*{kaupunki}">
				</div>
			</div>
			<div class="form-group row">
				<label for="uusiPaikka" class="col-sm-2 col-form-label col-form-label-lg">Lippumäärä</label>
				<div class="col-sm-2">
					<input type="number" class="form-control form-control-lg" id="uusiPaikka" step="1" th:field="*{maxLippumaara}">
				</div>
			</div>
			<div>
				<button type="submit" class="btn btn-primary">Tallenna</button>
			</div>
		</form>
	</body>
</html>
